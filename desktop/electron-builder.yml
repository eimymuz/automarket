# Configuración del instalador de Windows (electron-builder)
appId: mx.automarket.desktop
productName: AutoMarket
copyright: Equipo AutoMarket · Proyecto de Ingeniería de Datos

directories:
  output: release
  buildResources: build

# Solo el código compilado; React y demás librerías ya van empaquetadas por Vite dentro de out/
files:
  - out/**/*
  - package.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: AutoMarket-Setup-${version}.${ext}

nsis:
  oneClick: false                       # asistente con opciones
  perMachine: false                     # se instala para el usuario actual, sin permisos de administrador
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AutoMarket
  uninstallDisplayName: AutoMarket
  deleteAppDataOnUninstall: false       # conserva config.json (URL del servidor) al actualizar
